services:
  db:
    image: postgres:16-alpine
    container_name: ibero-data-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ibero
      POSTGRES_PASSWORD: ibero
      POSTGRES_DB: ibero_data
    ports:
      - "5433:5432"
    volumes:
      - ibero_data_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibero -d ibero_data"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: ibero-data-redis
    restart: unless-stopped
    # BullMQ needs every key kept (noeviction); appendonly keeps queued jobs across restarts.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    volumes:
      - ibero_data_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ibero_data_postgres:
  ibero_data_redis:
